title: Philipp Guldimann
description: Machine learning engineer in Zürich — LLM evaluation, trustworthy AI, data pipelines.
url: https://philippguldimann.ch
lang: en

author:
  name: Philipp Guldimann
  email: phil.guldimann@gmail.com

# Custom layouts live in _layouts — no remote theme.

# Pinned rather than left to the default: this is what makes kramdown turn
# $$…$$ into \(…\) / \[…\] delimiters, which assets/katex/render-math.js then
# renders. Switching engines silently breaks every equation on a `math: true`
# page — the delimiters change shape and the scanner stops matching.
kramdown:
  math_engine: mathjax

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: feed.xml

# Social card. jekyll-seo-tag reads `page.image`, so the `image` default under
# `defaults:` gives every page a preview; a post can override it with its own
# `image:`. No `twitter:` block here on purpose — without a real handle,
# seo-tag emits an empty `twitter:site` of "@" and derives a bogus
# `twitter:creator` from the author name.

permalink: /writing/:title/

# Concept notes: small, standalone, interlinked pages that the long-form posts
# link into. Backlinks are computed in _layouts/note.html by scanning rendered
# content for each note's URL — pure Liquid, so it works on the stock
# GitHub Pages build with no custom plugin.
collections:
  notes:
    output: true
    permalink: /notes/:name/

# Only posts get a blanket default. Pages set `layout:` explicitly so that
# front-matter'd assets (style.scss) never inherit an HTML layout.
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      image: /assets/img/og-card.png
  - scope:
      path: ""
      type: pages
    values:
      image: /assets/img/og-card.png
  - scope:
      path: ""
      type: notes
    values:
      layout: note
      image: /assets/img/og-card.png

social:
  github: philipplukas
  linkedin: philippguldimann

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - tools
